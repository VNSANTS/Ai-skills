name: Catalog validation

on:
  push:
    paths:
      - 'catalog/**'
      - 'scripts/validate_catalog.py'
      - '.github/workflows/catalog-validation.yml'
  pull_request:
    paths:
      - 'catalog/**'
      - 'scripts/validate_catalog.py'
      - '.github/workflows/catalog-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate metadata offline
        run: python scripts/validate_catalog.py
